[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whisperer-local"
version = "0.1.0"
description = "Local audio/video transcription CLI and web UI powered by Whisper."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
  "flask==3.1.3",
  "openai-whisper==20250625",
]

[project.scripts]
whisperer = "whisperer.__main__:main"
whisperer-web = "whisperer.web:main"

[tool.setuptools.packages.find]
include = ["whisperer*"]

[tool.setuptools.package-data]
whisperer = ["templates/*.html"]
